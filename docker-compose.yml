services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anyware-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${ANYWARE_SQL_PASSWORD:?Set ANYWARE_SQL_PASSWORD in your .env file}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: anyware-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:
